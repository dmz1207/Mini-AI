name: Build and publish MiniAI
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag'
        default: 'v1.0.1'
        required: true
      publish:
        description: 'Publish or replace release binaries after verification'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Build the small service
        shell: pwsh
        run: ./build.ps1
      - name: Fetch pinned OCR and formula assets and verify Hy-MT2/STQ assets
        shell: pwsh
        run: |
          python tools/fetch_models.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'Offline asset verification failed' }
      - name: Audit app-local dependency closure
        shell: pwsh
        run: |
          python tools/check_dependencies.py --root . --output work/dependency-checks.json
          if ($LASTEXITCODE -ne 0) { throw 'Unbundled native dependency' }
      - name: Test offline OCR, streaming, cancellation and desktop interaction
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.2.0 PyMuPDF==1.28.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install development-only test dependencies' }
          ./tools/test_all.ps1 -Root $PWD -Python python -Desktop
      - name: Package and verify the standalone EXE in an empty folder
        shell: pwsh
        run: |
          python tools/pack.py --output dist/MiniAI-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive verification failed' }
          ./tools/build_portable.ps1 -Package dist/MiniAI-windows-x64.zip -Output dist/MiniAI-Portable.exe
          python tools/test_portable.py --exe dist/MiniAI-Portable.exe --output work/portable-tests
          if ($LASTEXITCODE -ne 0) { throw 'Isolated single EXE checks failed' }
          Copy-Item work/tests/checks.json dist/service-checks.json
          Copy-Item work/tests/streaming-checks.json dist/streaming-checks.json
          Get-FileHash dist/MiniAI-windows-x64.zip,dist/MiniAI-Portable.exe -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  ' + (Split-Path $_.Path -Leaf) } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: miniai-verification
          path: work/tests/
          retention-days: 7
      - name: Publish the verified release
        if: inputs.publish == true
        shell: pwsh
        run: |
          $tag = '${{ inputs.version }}'
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          Copy-Item RELEASE.md dist/release-notes.md
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/MiniAI-Portable.exe dist/MiniAI-windows-x64.zip dist/SHA256SUMS.txt dist/service-checks.json dist/streaming-checks.json --repo $env:GITHUB_REPOSITORY --title "Mini-AI $tag" --notes-file dist/release-notes.md --target $env:GITHUB_SHA
          } else {
            gh release upload $tag dist/MiniAI-Portable.exe dist/MiniAI-windows-x64.zip dist/SHA256SUMS.txt dist/service-checks.json dist/streaming-checks.json --repo $env:GITHUB_REPOSITORY --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
