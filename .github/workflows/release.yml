name: Build and publish MiniAI
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag'
        default: 'v0.1.0'
        required: true
      native_run:
        description: 'Successful Offline AI native runtime run ID'
        default: '41215600743'
        required: true
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Build the small service
        shell: pwsh
        run: ./build.ps1
      - name: Get the verified CPU runtimes
        shell: pwsh
        run: |
          $run = '${{ inputs.native_run }}'
          if (-not $run) { $run = '41215600743' }
          $conclusion = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion
          if ($LASTEXITCODE -ne 0 -or $conclusion -ne 'success') { throw 'The native inference verification must pass first' }
          foreach ($variant in @('baseline','avx2')) {
            gh run download $run --repo $env:GITHUB_REPOSITORY --name "miniai-stq-windows-$variant" --dir "runtime/translation/$variant"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot get the verified native runtime' }
          }
      - name: Fetch and verify pinned offline models
        shell: pwsh
        run: |
          python tools/fetch_models.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'Offline asset verification failed' }
      - name: Include app-local Microsoft runtime dependencies
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $crt = Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x64\Microsoft.VC143.CRT' } | Where-Object { Test-Path -LiteralPath $_ -PathType Container } | Select-Object -First 1
          if (-not $crt) { throw 'Cannot locate Microsoft redistributable runtime' }
          foreach ($name in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            Copy-Item -LiteralPath (Join-Path $crt $name) -Destination runtime -Force
          }
      - name: Test actual offline OCR and translation
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.2.0 PyMuPDF==1.28.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install development-only test dependencies' }
          $process = Start-Process .\MiniAI.exe -ArgumentList '--headless --port 0' -WindowStyle Hidden -PassThru
          try {
            for ($i=0; $i -lt 100 -and -not (Test-Path state\connection.json); $i++) { Start-Sleep -Milliseconds 100 }
            python tools/test_service.py --output work/tests --translation
            if ($LASTEXITCODE -ne 0) { throw 'Offline integration tests failed' }
            ./tools/test_desktop.ps1 -Root $PWD -OutputDirectory work/tests/desktop
          } finally {
            if (Test-Path state\connection.json) {
              $connection = Get-Content state\connection.json -Raw | ConvertFrom-Json
              try { Invoke-RestMethod "$($connection.url)/v1/shutdown" -Method Post -ContentType 'application/json' -Headers @{ Authorization="Bearer $($connection.token)" } -Body '{}' | Out-Null } catch {}
            }
            if (-not $process.WaitForExit(5000)) { Stop-Process -Id $process.Id -Force }
          }
      - name: Make and independently verify the portable ZIP
        shell: pwsh
        run: |
          python tools/pack.py --output dist/MiniAI-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive verification failed' }
          Copy-Item work/tests/checks.json dist/service-checks.json
          Get-FileHash dist/MiniAI-windows-x64.zip -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  MiniAI-windows-x64.zip' } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Publish the tested offline package
        shell: pwsh
        run: |
          $tag = '${{ inputs.version }}'
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          @'
          One independent offline package for Mini PDF and other Windows applications.

          PP-OCRv6 medium OCR + Hy-MT2-1.8B 1.25-bit Chinese/English translation.
          Extract beside Mini PDF.exe, or select the MiniAI folder once in the reader.
          Models run locally; no Python, Office, GPU or cloud account is needed by users.
          See README.md, API.md, Models.md and Verification.md for usage, hashes and limits.
          '@ | Set-Content dist/release-notes.md -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/MiniAI-windows-x64.zip dist/SHA256SUMS.txt dist/service-checks.json --repo $env:GITHUB_REPOSITORY --title "MiniAI $tag" --notes-file dist/release-notes.md --target $env:GITHUB_SHA
          } else {
            gh release upload $tag dist/MiniAI-windows-x64.zip dist/SHA256SUMS.txt dist/service-checks.json --repo $env:GITHUB_REPOSITORY --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
